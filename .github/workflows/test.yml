name: Test Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  automation-tests:
    name: Execute ${{ matrix.suite-name }} Tests
    runs-on: ubuntu-latest

    # Declaramos la matriz para lanzar 3 servidores en paralelo completamente limpios
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite-name: "Compra"
            runner-class: "com.qvision.bonbonite.runners.compra.CompraTestSuite"
          - suite-name: "ActualizarDatos"
            runner-class: "com.qvision.bonbonite.runners.actualizacion.ActualizarDatosTestSuite"
          - suite-name: "IniciarSesion"
            runner-class: "com.qvision.bonbonite.runners.iniciarsesion.IniciarSesionTestSuite"
          - suite-name: "Registro"
            runner-class: "com.qvision.bonbonite.runners.registro.RegistroTestSuite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Execute Serenity Tests
        # Filtramos dinámicamente con '--tests' para correr solo el Runner correspondiente a esta máquina
        run: |
          ./gradlew clean test --tests "${{ matrix.runner-class }}" aggregate --no-daemon
        env:
          CHROME_HEADLESS_ARG: "--headless=new"

      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report-${{ matrix.suite-name }}
          path: target/site/serenity
          retention-days: 15
