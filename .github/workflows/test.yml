name: Test Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  automation-tests:
    name: Execute Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Solo instalamos Chrome estable. Selenium se encargará del driver correcto.
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Execute Serenity Tests
        run: |
          ./gradlew clean test aggregate --no-daemon
        env:
          # Esta variable inyectará la bandera '--headless=new' nativamente en tu serenity.conf
          CHROME_HEADLESS_ARG: "--headless=new"


      # Ajustado a la ruta correcta que definiste en tu serenity.conf (build/serenity)
      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-report
          path: target/site/serenity
          retention-days: 15
