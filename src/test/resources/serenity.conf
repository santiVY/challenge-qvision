serenity {
  project.name = "Bon-Bonite Automation"
  take.screenshots = FOR_FAILURES
  screenshot.level = DETAILED
  logging {
    level = INFO
  }
  console.colors = true
  verbose.steps = true
  logging = "VERBOSE"
}

webdriver {
  driver = chrome
  base.url = "https://bon-bonite.com"

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "--start-maximized",
        "--disable-extensions",
        "--disable-infobars",
        "--disable-notifications",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-gpu",
        "--window-size=1920,1080",
        # Inyecta dinámicamente el flag '--headless=new' en GitHub Actions, en local se ignora.
        ${?CHROME_HEADLESS_ARG}
      ]
    }
  }
}

browser {
  timeout {
    implicitlywait = 5000
    pollinginterval = 200
  }
}
