serenity {
  project.name = "Bon-Bonite Automation"
  
  webdriver {
    driver = chrome
    base.url = "https://www.bon-bonite.com"
    
    chrome {
      switches = [
        "--start-maximized",
        "--disable-extensions",
        "--disable-infobars",
        "--disable-notifications"
      ]
    }
  }
  
  headless {
    mode = false
  }
  
  browser {
    timeout {
      implicitlywait = 5000
      pollinginterval = 200
    }
  }
  
  take.screenshots = FOR_FAILURES
  screenshot.level = DETAILED
  
  outputDirectory = "build/serenity"
  
  logging {
    level = INFO
  }
}
