serenity {
  project.name = "Bon-Bonite Automation"
  take.screenshots = FOR_FAILURES
  screenshot.level = DETAILED
  outputDirectory = "target/site/serenity"
  logging {
    level = INFO
  }
}

webdriver {
  driver = chrome
  autodownload = true
  base.url = "https://www.bon-bonite.com"

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "--start-maximized",
        "--disable-extensions",
        "--disable-infobars",
        "--disable-notifications",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-gpu",
        "--window-size=1920,1080"
      ]
    }
  }
}

headless.mode = ${?headless.mode}

browser {
  timeout {
    implicitlywait = 5000
    pollinginterval = 200
  }
}